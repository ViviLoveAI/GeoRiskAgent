services:
  api:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEORISK_INTERACTIVE_EVENT_ANALYZER: ${GEORISK_INTERACTIVE_EVENT_ANALYZER:-rule}
      LLM_EVENT_ANALYST_MODEL: ${LLM_EVENT_ANALYST_MODEL:-gpt-4.1-mini}
      LLM_EVENT_ANALYST_TIMEOUT_SECONDS: ${LLM_EVENT_ANALYST_TIMEOUT_SECONDS:-5}
      LLM_EVENT_ANALYST_MAX_RETRIES: ${LLM_EVENT_ANALYST_MAX_RETRIES:-0}
    volumes:
      - .:/app
    restart: unless-stopped

  streamlit:
    build: .
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      PYTHONPATH: /app
      GEORISK_API_URL: http://api:8000
    volumes:
      - .:/app
    depends_on:
      - api
    restart: unless-stopped
