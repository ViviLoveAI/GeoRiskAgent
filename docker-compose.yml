services:
  api:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
    restart: unless-stopped

  streamlit:
    build: .
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
    depends_on:
      - api
    restart: unless-stopped
