<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">GeoRisk v1.0.0 — System Architecture</title>
  <desc id="desc">Bounded agentic recovery with a frozen deterministic verification boundary.</desc>
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 36px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section-title { font: 700 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; letter-spacing: 0.2px; }
      .section-tag { font: 600 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: 1.1px; }
      .node-title { font: 700 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .node-sub { font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .small { font: 600 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .note { font: 600 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section { stroke-width: 1.4; rx: 24; filter: url(#softShadow); }
      .card { fill: #ffffff; stroke-width: 1.2; rx: 14; }
      .arrow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .flow-label { font: 700 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .legend-text { font: 600 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="920"/>
  <circle cx="1460" cy="78" r="96" fill="#dbeafe" opacity="0.36"/>
  <circle cx="230" cy="840" r="140" fill="#ede9fe" opacity="0.25"/>

  <text x="80" y="72" class="title">GeoRisk v1.0.0 — System Architecture</text>
  <text x="80" y="104" class="subtitle">Bounded agentic recovery with a frozen deterministic verification boundary.</text>

  <!-- Section 1: Application / Input Layer -->
  <rect x="55" y="155" width="230" height="545" class="section" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="80" y="190" class="section-tag" fill="#2563eb">Application / Input</text>
  <text x="80" y="218" class="section-title">User Access Layer</text>

  <rect x="85" y="265" width="170" height="76" class="card" stroke="#bfdbfe"/>
  <circle cx="116" cy="303" r="16" fill="#dbeafe" stroke="#60a5fa"/>
  <path d="M108 303 h16 M116 295 v16" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/>
  <text x="142" y="298" class="node-title">Browser</text>
  <text x="142" y="318" class="node-sub">User access</text>

  <rect x="85" y="385" width="170" height="76" class="card" stroke="#bfdbfe"/>
  <rect x="101" y="404" width="31" height="22" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <path d="M106 431 h21" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
  <text x="142" y="418" class="node-title">Streamlit UI</text>
  <text x="142" y="438" class="node-sub">Interactive UI</text>

  <rect x="85" y="505" width="170" height="76" class="card" stroke="#bfdbfe"/>
  <path d="M105 525 h28 v22 h-28 z M111 532 h16 M111 540 h12" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="142" y="538" class="node-title">FastAPI API</text>
  <text x="142" y="558" class="node-sub">REST / JSON</text>

  <path d="M170 341 V385" class="arrow" stroke="#3b82f6" marker-end="url(#arrowBlue)"/>
  <path d="M170 461 V505" class="arrow" stroke="#3b82f6" marker-end="url(#arrowBlue)"/>

  <!-- Section 2: Event & Historical Evidence -->
  <rect x="330" y="155" width="285" height="545" class="section" fill="#ecfdf5" stroke="#86efac"/>
  <text x="360" y="190" class="section-tag" fill="#15803d">Event &amp; Historical Evidence</text>
  <text x="360" y="218" class="section-title">Grounded Retrieval</text>

  <rect x="380" y="265" width="185" height="76" class="card" stroke="#bbf7d0"/>
  <circle cx="412" cy="303" r="16" fill="#dcfce7" stroke="#4ade80"/>
  <path d="M406 303 h12 M412 297 v12 M404 310 c5 8 16 8 21 0" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="438" y="298" class="node-title">Event Analyst</text>
  <text x="438" y="318" class="node-sub">Current event state</text>

  <rect x="380" y="385" width="185" height="76" class="card" stroke="#bbf7d0"/>
  <path d="M402 415 c0 -12 20 -12 20 0 c0 12 -20 12 -20 0 M421 426 l11 11" stroke="#16a34a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <text x="438" y="418" class="node-title">Case Retrieval</text>
  <text x="438" y="438" class="node-sub">top_k = 10</text>

  <rect x="380" y="505" width="185" height="76" class="card" stroke="#bbf7d0"/>
  <ellipse cx="417" cy="526" rx="18" ry="8" fill="#dcfce7" stroke="#4ade80"/>
  <path d="M399 526 v22 c0 5 36 5 36 0 v-22 M399 537 c0 5 36 5 36 0" stroke="#16a34a" stroke-width="1.8" fill="none"/>
  <text x="448" y="538" class="node-title">ChromaDB</text>
  <text x="448" y="558" class="node-sub">Historical KB</text>

  <path d="M472 341 V385" class="arrow" stroke="#16a34a" marker-end="url(#arrowGreen)"/>
  <path d="M472 461 V505" class="arrow" stroke="#16a34a" marker-end="url(#arrowGreen)"/>

  <!-- Section 3: V5 LangGraph Recovery Layer -->
  <rect x="640" y="130" width="390" height="595" class="section" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="670" y="168" class="section-tag" fill="#7c3aed">V5 LangGraph Recovery Layer</text>
  <text x="670" y="197" class="section-title">Bounded Recovery Loop</text>

  <rect x="700" y="230" width="270" height="74" class="card" stroke="#c4b5fd"/>
  <text x="730" y="258" class="node-title">LangGraph Supervisor / Router</text>
  <text x="730" y="278" class="node-sub">Shared analysis state</text>
  <text x="730" y="296" class="node-sub">Routes by evidence + budget</text>

  <rect x="700" y="330" width="270" height="64" class="card" stroke="#ddd6fe"/>
  <text x="730" y="359" class="node-title">Diagnose Repair Need</text>
  <text x="730" y="379" class="node-sub">Evidence-state decision</text>

  <rect x="735" y="430" width="200" height="64" class="card" stroke="#ddd6fe"/>
  <text x="780" y="459" class="node-title">Node Repair</text>
  <text x="780" y="479" class="node-sub">Candidate gap</text>

  <rect x="710" y="530" width="250" height="64" class="card" stroke="#ddd6fe"/>
  <text x="745" y="559" class="node-title">Context Projection</text>
  <text x="745" y="579" class="node-sub">Repaired current context</text>

  <rect x="695" y="630" width="280" height="64" class="card" stroke="#ddd6fe"/>
  <text x="730" y="659" class="node-title">Specificity Recovery</text>
  <text x="730" y="679" class="node-sub">Candidate-local recovery</text>

  <path d="M835 304 V330" class="arrow" stroke="#7c3aed" marker-end="url(#arrowPurple)"/>
  <path d="M835 394 V430" class="arrow" stroke="#7c3aed" marker-end="url(#arrowPurple)"/>
  <path d="M835 494 V530" class="arrow" stroke="#7c3aed" marker-end="url(#arrowPurple)"/>
  <path d="M835 594 V630" class="arrow" stroke="#7c3aed" marker-end="url(#arrowPurple)"/>
  <path d="M695 662 C620 610 620 274 700 267" class="arrow" stroke="#7c3aed" marker-end="url(#arrowPurple)" stroke-dasharray="8 7"/>
  <path d="M970 267 C1014 267 1026 299 1060 299" class="arrow" stroke="#7c3aed" marker-end="url(#arrowPurple)" stroke-dasharray="6 6"/>
  <text x="998" y="255" class="flow-label">verify / finalize</text>

  <rect x="698" y="728" width="274" height="78" rx="16" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
  <text x="725" y="756" class="note" fill="#6d28d9">Explicit state transitions</text>
  <text x="725" y="779" class="note" fill="#6d28d9">Conditional routing</text>
  <text x="725" y="802" class="note" fill="#6d28d9">Max repair attempts = 1</text>

  <!-- Section 4: Frozen V4 Verification Boundary -->
  <rect x="1060" y="155" width="285" height="545" rx="24" fill="#fef2f2" stroke="#dc2626" stroke-width="3" filter="url(#softShadow)"/>
  <rect x="1072" y="167" width="261" height="521" rx="18" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="10 7"/>
  <text x="1092" y="190" class="section-tag" fill="#b91c1c">Frozen V4 Trust Boundary</text>
  <text x="1092" y="218" class="section-title">Deterministic Verification</text>

  <rect x="1102" y="270" width="200" height="58" class="card" stroke="#fecaca"/>
  <text x="1130" y="294" class="node-title">Mechanism Compatibility</text>
  <text x="1130" y="314" class="node-sub">Case-grounded support</text>

  <rect x="1102" y="355" width="200" height="58" class="card" stroke="#fecaca"/>
  <text x="1130" y="379" class="node-title">Support Threshold ≥ 2</text>
  <text x="1130" y="399" class="node-sub">Frozen evidence rule</text>

  <rect x="1102" y="440" width="200" height="58" class="card" stroke="#fecaca"/>
  <text x="1130" y="464" class="node-title">Broad-node Guardrails</text>
  <text x="1130" y="484" class="node-sub">Conservative filtering</text>

  <rect x="1102" y="525" width="200" height="58" class="card" stroke="#fecaca"/>
  <text x="1130" y="549" class="node-title">Applicability Gate</text>
  <text x="1130" y="569" class="node-sub">Current-event grounded</text>

  <rect x="1102" y="625" width="200" height="50" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="1.2"/>
  <text x="1126" y="646" class="note" fill="#991b1b">Deterministic rules.</text>
  <text x="1126" y="665" class="note" fill="#991b1b">V5 cannot override.</text>

  <!-- Section 5: Output Layer -->
  <rect x="1390" y="155" width="155" height="545" class="section" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1413" y="190" class="section-tag" fill="#c2410c">Output</text>
  <text x="1413" y="218" class="section-title">Verified Results</text>

  <rect x="1410" y="262" width="115" height="64" class="card" stroke="#fed7aa"/>
  <text x="1425" y="289" class="node-title">Transmission</text>
  <text x="1425" y="309" class="node-sub">Chain</text>

  <rect x="1410" y="365" width="115" height="64" class="card" stroke="#fed7aa"/>
  <text x="1425" y="392" class="node-title">Evidence</text>
  <text x="1425" y="412" class="node-sub">Grade</text>

  <rect x="1410" y="468" width="115" height="78" class="card" stroke="#fed7aa"/>
  <text x="1425" y="495" class="node-title">Ranked</text>
  <text x="1425" y="515" class="node-sub">Second-Order</text>
  <text x="1425" y="533" class="node-sub">Watchlist</text>

  <rect x="1410" y="585" width="115" height="70" class="card" stroke="#fed7aa"/>
  <text x="1425" y="612" class="node-title">Final Report</text>
  <text x="1425" y="632" class="node-sub">API Response</text>

  <path d="M255 543 C286 543 298 424 330 424" class="arrow" stroke="#3b82f6" marker-end="url(#arrowBlue)"/>
  <text x="281" y="407" class="flow-label">event input</text>

  <path d="M565 424 C598 424 607 424 640 424" class="arrow" stroke="#16a34a" marker-end="url(#arrowGreen)"/>
  <text x="585" y="407" class="flow-label">evidence state</text>

  <path d="M1030 424 C1040 424 1050 424 1060 424" class="arrow" stroke="#7c3aed" marker-end="url(#arrowPurple)"/>
  <text x="1002" y="407" class="flow-label">verified candidates</text>

  <path d="M1345 424 C1365 424 1374 424 1390 424" class="arrow" stroke="#dc2626" marker-end="url(#arrowRed)"/>
  <text x="1348" y="407" class="flow-label">retained only</text>

  <path d="M1467 326 V365" class="arrow" stroke="#ea580c" marker-end="url(#arrowOrange)"/>
  <path d="M1467 429 V468" class="arrow" stroke="#ea580c" marker-end="url(#arrowOrange)"/>
  <path d="M1467 546 V585" class="arrow" stroke="#ea580c" marker-end="url(#arrowOrange)"/>

  <!-- Compact role strip -->
  <rect x="275" y="835" width="1050" height="46" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="305" y="863" class="legend-text">Roles:</text>
  <circle cx="384" cy="858" r="6" fill="#22c55e"/><text x="398" y="863" class="legend-text">Event Analyst</text>
  <circle cx="520" cy="858" r="6" fill="#22c55e"/><text x="534" y="863" class="legend-text">Retriever</text>
  <circle cx="630" cy="858" r="6" fill="#8b5cf6"/><text x="644" y="863" class="legend-text">Diagnoser</text>
  <circle cx="748" cy="858" r="6" fill="#8b5cf6"/><text x="762" y="863" class="legend-text">Repairer</text>
  <circle cx="855" cy="858" r="6" fill="#8b5cf6"/><text x="869" y="863" class="legend-text">Projector</text>
  <circle cx="966" cy="858" r="6" fill="#8b5cf6"/><text x="980" y="863" class="legend-text">Recovery</text>
  <circle cx="1084" cy="858" r="6" fill="#ef4444"/><text x="1098" y="863" class="legend-text">Verifier (V4)</text>
  <circle cx="1218" cy="858" r="6" fill="#f97316"/><text x="1232" y="863" class="legend-text">Reporter</text>
</svg>
